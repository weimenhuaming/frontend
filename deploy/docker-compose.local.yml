# 本地开发：前端容器访问宿主机 Gateway（GoLand 等，无需 Docker 后端）
services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NUXT_API_PROXY_TARGET: http://host.docker.internal:9000
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    restart: unless-stopped
